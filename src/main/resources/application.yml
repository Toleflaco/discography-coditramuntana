spring:
  datasource:
    url: jdbc:h2:file:./data/discography;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate      # ← ANTES: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:                     # ← NUEVO bloque
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
